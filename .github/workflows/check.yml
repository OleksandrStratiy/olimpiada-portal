name: Перевірка курсу і задач

on:
  push:
    paths:
      - "data/**"
      - "lessons/**"
      - "tools/**"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "data/**"
      - "lessons/**"
      - "tools/**"
      - ".github/workflows/check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Компіляція прикладів і перевірка розв'язків
        run: python tools/check.py
