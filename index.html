<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#F6F7FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11141B" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Тему застосовуємо до завантаження стилів сторінки, щоб не було спалаху світлої теми.
    try {
      var t = JSON.parse(localStorage.getItem("oz_theme"));
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">

      <a class="logo" href="#/" aria-label="Зошит олімпіадника — на головну">

      </a>
      <nav class="nav" aria-label="Розділи сайту">
        <a href="#/course" data-nav="course">Курс</a>
        <a href="#/problems" data-nav="problems">Задачі</a>
        <a href="#/olympiads" data-nav="olympiads">Олімпіади</a>
        <a href="#/progress" data-nav="progress">Прогрес</a>
      </nav>

  </main>

  <footer class="footer">
    <div class="footer-in">
      <span>Зошит олімпіадника — курс C++ і задачі для підготовки до олімпіади з інформатики.</span>
